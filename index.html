<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Học HSK</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Học HSK</h1>
    <nav id="tabs" class="tabs" aria-label="Chế độ">
      <button type="button" class="tab" data-view="browse" aria-pressed="true">Từ vựng</button>
      <button type="button" class="tab" data-view="flash" aria-pressed="false">Flashcard</button>
      <button type="button" class="tab" data-view="context" aria-pressed="false">Ngữ cảnh</button>
      <button type="button" class="tab" data-view="backup" aria-pressed="false">Sao lưu</button>
    </nav>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Đổi giao diện sáng/tối">◐</button>
  </header>

  <div id="backup-banner" class="banner" hidden></div>

  <main>
    <section id="view-browse">
      <section class="controls" aria-label="Tìm và lọc từ">
        <input id="search" type="search" placeholder="Tìm chữ Hán, pinyin (có hoặc không dấu), nghĩa…" autocomplete="off">
        <div id="level-filter" class="chips" role="group" aria-label="Lọc theo cấp HSK"></div>
        <select id="topic-filter" class="select" aria-label="Lọc theo chủ đề"></select>
        <div id="known-filter" class="chips" role="group" aria-label="Lọc theo trạng thái học"></div>
      </section>

      <p id="summary" class="summary" aria-live="polite"></p>
      <ul id="word-list" class="word-list"></ul>
      <button id="load-more" class="more-btn" type="button" hidden>Xem thêm</button>
    </section>

    <section id="view-flash" hidden aria-label="Flashcard"></section>
    <section id="view-context" hidden aria-label="Học theo ngữ cảnh"></section>
    <section id="view-backup" hidden aria-label="Sao lưu tiến độ"></section>
  </main>

  <footer class="footer">
    <p>Danh sách từ: <a href="https://github.com/ivankra/hsk30" target="_blank" rel="noopener">ivankra/hsk30</a> (MIT), dựa trên đề cương HSK 3.0.
    Nghĩa tiếng Việt, âm Hán-Việt và câu ví dụ do AI tạo, chỉ mang tính tham khảo.
    Tiến độ học chỉ lưu trên trình duyệt này.</p>
  </footer>

  <script src="data/hsk1-6.js"></script>
  <script src="data/topics.js"></script>
  <script src="data/content/hsk1.js"></script>
  <script src="data/content/hsk2.js"></script>
  <script src="data/content/hsk3.js"></script>
  <script src="data/content/hsk4.js"></script>
  <script src="data/content/hsk5.js"></script>
  <script src="data/content/hsk6.js"></script>
  <script src="js/store.js"></script>
  <script src="js/topics.js"></script>
  <script src="js/app.js"></script>
  <script src="js/flashcard.js"></script>
  <script src="js/context.js"></script>
  <script src="js/backup.js"></script>
</body>
</html>
